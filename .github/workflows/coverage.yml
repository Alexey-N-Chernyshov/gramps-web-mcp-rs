name: Coverage

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Builds the coverage-matrix leg list from whatever's actually in
  # `tests/*.rs` right now, plus the fixed `unit` leg (`--lib --bins`), so
  # a new integration test file is picked up automatically instead of
  # needing a matching matrix entry added by hand.
  discover-tests:
    name: Discover integration test files
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          matrix=$(
            for f in tests/*.rs; do basename "$f" .rs; done \
              | jq -R -s -c '
                  split("\n") | map(select(length > 0)) |
                  map({name: ., args: ("--test " + .)})
                ' \
              | jq -c '[{name: "unit", args: "--lib --bins"}] + .'
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  coverage-warmup:
    name: Warm coverage build cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - name: Pre-build lib + all test binaries under coverage instrumentation
        run: |
          eval "$(cargo llvm-cov show-env --export-prefix)"
          export CARGO_TARGET_DIR="$CARGO_LLVM_COV_TARGET_DIR/llvm-cov-target"
          cargo build --tests

  coverage-matrix:
    name: Coverage (${{ matrix.name }})
    needs: [coverage-warmup, discover-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover-tests.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - name: Run coverage (${{ matrix.name }})
        run: cargo llvm-cov ${{ matrix.args }} --lcov --output-path lcov.info

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-${{ matrix.name }}
          path: lcov.info
          retention-days: 1

  # Required-status-check aggregator: branch protection targets this stable
  # job name instead of the per-matrix-leg names above, which change
  # whenever a test file is added/removed/renamed.
  coverage:
    name: Coverage
    needs: coverage-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.coverage-matrix.result }}" != "success" ]; then
            echo "One or more coverage matrix legs failed"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Download lcov artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lcov-*
          path: coverage-reports
          merge-multiple: false

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: coverage-reports
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}

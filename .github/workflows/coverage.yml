name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Single job: the whole test suite shares one Gramps Web instance via `GRAMPS_TEST_URL`
  # instead of each integration test file spinning up its own docker-compose stack through
  # testcontainers (see tests/support/helpers.rs). Nothing here names individual test files —
  # `--tests` picks up whatever's in `tests/*.rs` automatically.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - name: Start Gramps Web test stack
        run: |
          docker compose -f docker-compose.test.yml up -d
          port=$(docker compose -f docker-compose.test.yml port grampsweb-test 5000 | cut -d: -f2)
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port/api/metadata/") || true
            [ "$code" != "000" ] && break
            sleep 1
          done
          if [ "$code" = "000" ]; then
            echo "::error::Gramps Web test stack did not respond within 60 seconds"
            docker compose -f docker-compose.test.yml logs
            exit 1
          fi
          echo "GRAMPS_TEST_URL=http://localhost:$port" >> "$GITHUB_ENV"

      - name: Run coverage
        run: cargo llvm-cov --lib --bins --tests --lcov --output-path lcov.info

      - name: Stop Gramps Web test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}

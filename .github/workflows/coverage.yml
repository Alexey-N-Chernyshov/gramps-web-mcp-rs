name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Single job: the whole test suite shares one Gramps Web instance via `GRAMPS_TEST_URL`
  # instead of each integration test file spinning up its own docker-compose stack through
  # testcontainers (see tests/support/helpers.rs). Nothing here names individual test files —
  # `--tests` picks up whatever's in `tests/*.rs` automatically.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Backgrounded and not waited for here at all: the test fixture itself waits for
      # readiness (GET /ready, see tests/support/helpers.rs) once GRAMPS_TEST_URL is set, so
      # this just needs to be kicked off before "Run coverage" — the image pull + container
      # start overlap with the toolchain/cache steps below instead of blocking in front of
      # them. docker-compose.ci.yml fixes the host port so the URL is known upfront.
      - name: Start Gramps Web test stack (background)
        run: |
          nohup docker compose -f docker-compose.test.yml -f docker-compose.ci.yml up -d \
            > compose.log 2>&1 &

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage-v2
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov

      # Builds/runs via plain `cargo test` (coverage-instrumented through show-env's exported
      # RUSTC_WRAPPER etc.), not `cargo llvm-cov --lib --bins --tests` directly: that writes
      # to a nested target/llvm-cov-target/ that rust-cache's restore doesn't make reusable
      # across runs — every run recompiles every dependency from scratch despite a cache hit.
      # Plain `cargo test` builds into the ordinary target/debug/ instead, which does get
      # reused. `cargo llvm-cov report` only turns the resulting profile data into lcov.info;
      # it doesn't build or run anything itself.
      - name: Run coverage
        env:
          GRAMPS_TEST_URL: http://localhost:5055
        run: |
          show_env=$(cargo llvm-cov show-env)
          while IFS= read -r line; do
            key=${line%%=*}
            value=${line#*=}
            value=${value#\'}
            value=${value%\'}
            export "${key}=${value}"
          done <<< "$show_env"

          # rust-cache restores target/ across runs, which can leave stale .profraw files
          # from a previous run's instrumented binaries lying around — `cargo test` doesn't
          # overwrite .profraw per run, it adds to whatever's already there, so without this
          # the report can silently count coverage for code that no longer exists.
          cargo llvm-cov clean --workspace
          cargo test --lib --bins --tests
          cargo llvm-cov report --lcov --output-path lcov.info

      # Runner is thrown away after the job either way, so there's no teardown step —
      # only logs, and only when something actually went wrong.
      - name: Show Gramps Web logs
        if: failure()
        run: |
          cat compose.log
          docker compose -f docker-compose.test.yml -f docker-compose.ci.yml logs

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}
